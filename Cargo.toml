[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
floe-core = { path = "crates/core" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
image = { version = "=0.25.9", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
glib = "0.21"
png = "0.18.1"
thiserror = "2.0"
rustix = { version = "1.1", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
