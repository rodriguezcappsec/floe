[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Floe — a spatial file manager for Wayland"
repository = "https://github.com/rodriguezcappsec/floe"
homepage = "https://github.com/rodriguezcappsec/floe"
license = "LicenseRef-proprietary"

[workspace.dependencies]
floe-core = { path = "crates/core" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
image = { version = "=0.25.9", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "=0.6.1"
lofty = "=0.22.4"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
glib = "0.21"
gio = { version = "0.21", features = ["v2_72"] }
gdk4-wayland = "0.10"
png = "0.18.1"
regex = "=1.12.2"
sevenz-rust = { version = "=0.6.1", default-features = false, features = ["compress"] }
tar = "=0.4.46"
thiserror = "2.0"
rustix = { version = "1.1", features = ["fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xz2 = { version = "=0.1.7", features = ["static"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
